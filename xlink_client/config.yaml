  advertise_tags: []
  forward: ""
schema:
  auth_key: str
  login_server: str?
  hostname: str?
  accept_dns: bool?
  advertise_routes:
    - str?
  advertise_exit_node: bool?
  advertise_tags:
    - str?
  forward: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
